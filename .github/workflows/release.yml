name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # An independent rebuild of the tag on a different host, OS and path. The
  # release job publishes only if its binary is byte-identical to this one.
  rebuild:
    runs-on: macos-latest
    env:
      GOMAXPROCS: "2"
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: rebuild/macserve
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: rebuild/macserve/go.mod
          cache: false
      - name: Rebuild Darwin arm64 release
        id: build
        run: |
          line=$(rebuild/macserve/checks/release-build.sh "$RUNNER_TEMP/rebuild")
          echo "$line"
          echo "sha256=${line%% *}" >> "$GITHUB_OUTPUT"

  release:
    needs: rebuild
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build Darwin arm64 release
        run: checks/release-build.sh "$RUNNER_TEMP/dist"
      - name: Require a byte-identical independent rebuild
        working-directory: ${{ runner.temp }}/dist
        env:
          REBUILT_SHA256: ${{ needs.rebuild.outputs.sha256 }}
        run: |
          sha256sum macserve-darwin-arm64 > SHA256SUMS
          cat SHA256SUMS
          echo "$REBUILT_SHA256  macserve-darwin-arm64" | sha256sum --check --strict
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/macserve-darwin-arm64
      - name: Verify the attestation as a consumer would
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh attestation verify macserve-darwin-arm64 \
            --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - name: Publish GitHub release
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            macserve-darwin-arm64 SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" \
            --notes "Darwin arm64 macserve built by checks/release-build.sh (CGO disabled, -trimpath, -buildvcs=true), rebuilt byte-identically on a second runner, with a GitHub build provenance attestation (gh attestation verify macserve-darwin-arm64 --repo $GH_REPO). Verify SHA256SUMS against the reviewed release before installation."
