name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # An independent rebuild of the tag on a different host, OS and path. The
  # release job publishes only if both its binaries are byte-identical to
  # these.
  rebuild:
    runs-on: macos-latest
    env:
      GOMAXPROCS: "2"
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
      controller-sha256: ${{ steps.build.outputs.controller-sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: rebuild/macserve
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: rebuild/macserve/go.mod
          cache: false
      - name: Rebuild Darwin arm64 release
        id: build
        run: |
          rebuild/macserve/checks/release-build.sh "$RUNNER_TEMP/rebuild" > "$RUNNER_TEMP/rebuild.sums"
          cat "$RUNNER_TEMP/rebuild.sums"
          {
            echo "sha256=$(awk '$2 ~ /\/macserve-darwin-arm64$/ { print $1 }' "$RUNNER_TEMP/rebuild.sums")"
            echo "controller-sha256=$(awk '$2 ~ /\/macserve-controller-darwin-arm64$/ { print $1 }' "$RUNNER_TEMP/rebuild.sums")"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: rebuild
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      # The carry-proof step reads CI runs of the tag commit.
      actions: read
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # The carry-proof step diffs the tag against its predecessor tag.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build Darwin arm64 release
        run: checks/release-build.sh "$RUNNER_TEMP/dist"
      - name: Require a byte-identical independent rebuild
        working-directory: ${{ runner.temp }}/dist
        env:
          REBUILT_SHA256: ${{ needs.rebuild.outputs.sha256 }}
          REBUILT_CONTROLLER_SHA256: ${{ needs.rebuild.outputs.controller-sha256 }}
        run: |
          sha256sum macserve-darwin-arm64 macserve-controller-darwin-arm64 > SHA256SUMS
          cat SHA256SUMS
          printf '%s  %s\n' \
            "$REBUILT_SHA256" macserve-darwin-arm64 \
            "$REBUILT_CONTROLLER_SHA256" macserve-controller-darwin-arm64 |
            sha256sum --check --strict
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/macserve-darwin-arm64
            ${{ runner.temp }}/dist/macserve-controller-darwin-arm64
      - name: Verify the attestation as a consumer would
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for f in macserve-darwin-arm64 macserve-controller-darwin-arm64; do
            gh attestation verify "$f" \
              --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      # A release that changes only C, G and T paths (by the predecessor
      # release's BOUNDARY.json) carries qualification: macserve upgrade
      # accepts a carry only from this release's carry-proof.json asset, with
      # its digest in this SHA256SUMS. Any other release publishes without one
      # (the generator then prints "no carry proof: REASON" and exits 0).
      - name: Build release-carry proof
        id: carry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          REBUILT_SHA256: ${{ needs.rebuild.outputs.sha256 }}
          REBUILT_CONTROLLER_SHA256: ${{ needs.rebuild.outputs.controller-sha256 }}
          DIST: ${{ runner.temp }}/dist
        run: |
          # The proof must describe the commit this job built and attested.
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          binary=$(sha256sum "$DIST/macserve-darwin-arm64")
          controller=$(sha256sum "$DIST/macserve-controller-darwin-arm64")
          go run ./checks/carry-proof \
            -repo "$GH_REPO" -tag "$RELEASE_TAG" \
            -binary-sha256 "${binary%% *}" -rebuilt-sha256 "$REBUILT_SHA256" \
            -controller-binary-sha256 "${controller%% *}" \
            -controller-rebuilt-sha256 "$REBUILT_CONTROLLER_SHA256" \
            -out "$DIST/carry-proof.json"
          subjects="$DIST/SHA256SUMS"
          if [ -f "$DIST/carry-proof.json" ]; then
            (cd "$DIST" && sha256sum carry-proof.json >> SHA256SUMS)
            cat "$DIST/carry-proof.json"
            subjects="$subjects,$DIST/carry-proof.json"
          fi
          cat "$DIST/SHA256SUMS"
          echo "subjects=$subjects" >> "$GITHUB_OUTPUT"
      # SHA256SUMS (and carry-proof.json, when built) get their own build
      # provenance attestation, so an owner can verify the digest list and the
      # proof macserve upgrade trusts, not only the binaries.
      - name: Attest SHA256SUMS and the carry proof
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.carry.outputs.subjects }}
      - name: Verify the SHA256SUMS and carry proof attestations
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(SHA256SUMS)
          if [ -f carry-proof.json ]; then
            files+=(carry-proof.json)
          fi
          for f in "${files[@]}"; do
            gh attestation verify "$f" \
              --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      # Runs only after the byte-identical rebuild, attestation and consumer
      # verification gates above. The formula takes both digests from the
      # SHA256SUMS that was just checked against the rebuild, and is published
      # with the release. The tap (jerryfane/homebrew-macserve) is bumped by a
      # reviewed PR that copies this asset; this workflow holds no tap token.
      - name: Render Homebrew formula
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          DIST: ${{ runner.temp }}/dist
        run: |
          go run ./checks/homebrew-formula \
            -tag "$RELEASE_TAG" -repo "$GH_REPO" \
            -sums "$DIST/SHA256SUMS" > "$DIST/macserve.rb"
          cat "$DIST/macserve.rb"
      - name: Publish GitHub release
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(macserve-darwin-arm64 macserve-controller-darwin-arm64 SHA256SUMS macserve.rb)
          carry="No carry-proof.json: this release changes a boundary path over its predecessor (or the change could not be proved), so it carries no qualification."
          if [ -f carry-proof.json ]; then
            assets+=(carry-proof.json)
            carry="carry-proof.json, listed in SHA256SUMS, proves this release changes only C, G and T paths of its predecessor's BOUNDARY.json; macserve upgrade accepts a release carry only from it."
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag --title "$RELEASE_TAG" \
            --notes "Darwin arm64 macserve and macserve-controller built by checks/release-build.sh (CGO disabled, -trimpath, -buildvcs=true), rebuilt byte-identically on a second runner, with GitHub build provenance attestations for both, SHA256SUMS and carry-proof.json when present (gh attestation verify FILE --repo $GH_REPO). Verify SHA256SUMS (and carry-proof.json) that way before macserve setup or macserve upgrade. $carry"
