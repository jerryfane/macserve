name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      GOMAXPROCS: "2"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Vet
        run: nice -n 10 go vet -p 2 ./...
      - name: Test
        run: nice -n 10 go test -p 2 ./...
      - name: Build CLI
        run: nice -n 10 go build -p 2 -o "${{ runner.temp }}/macserve" ./cmd/macserve
      - name: CLI smoke
        run: |
          nice -n 10 "${{ runner.temp }}/macserve" --help
          nice -n 10 "${{ runner.temp }}/macserve" maintenance --help
