name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      GOMAXPROCS: "2"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
          shellcheck --shell=bash assets/*.sh checks/release-build.sh
      - name: Public CI failure redaction tests
        run: python3 -m unittest discover -s checks/native-history-fixture -p 'test_ci.py' -v
      - name: Vet
        run: nice -n 10 go vet -p 2 ./...
      - name: Boundary classification (BOUNDARY.json, C/G source rules)
        run: nice -n 10 go test -count=1 -v ./checks/boundary
      - name: Test
        run: nice -n 10 go test -p 2 ./...
      - name: Real-mount tests (macOS)
        if: runner.os == 'macOS'
        run: nice -n 10 go test -count=1 -v -run 'RealImage|NeverEnters|RealMount|StudioStatfs' ./internal/maintenance ./internal/worker
      - name: Build CLI
        run: |
          nice -n 10 go build -p 2 -o "${{ runner.temp }}/macserve" ./cmd/macserve
          nice -n 10 go build -p 2 -o "${{ runner.temp }}/macserve-controller" ./cmd/macserve-controller
      # The controller daemon is its own binary; macserve has no controller
      # subcommand.
      - name: CLI smoke
        run: |
          nice -n 10 "${{ runner.temp }}/macserve-controller" --help
          nice -n 10 "${{ runner.temp }}/macserve-controller" version --json
          nice -n 10 "${{ runner.temp }}/macserve" --help
          nice -n 10 "${{ runner.temp }}/macserve" maintenance --help
          nice -n 10 "${{ runner.temp }}/macserve" deploy-install --help
          nice -n 10 "${{ runner.temp }}/macserve" qualify --help

  # The release build must not depend on the host, OS or checkout path. These
  # two jobs mirror release.yml: a macOS rebuild in a nested path and a Linux
  # build in the default workspace, both through checks/release-build.sh, must
  # produce the same bytes.
  reproducible-rebuild:
    name: Reproducible release build (macOS rebuild)
    runs-on: macos-latest
    env:
      GOMAXPROCS: "2"
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
      controller-sha256: ${{ steps.build.outputs.controller-sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: rebuild/macserve
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: rebuild/macserve/go.mod
          cache: false
      - name: Rebuild Darwin arm64 release
        id: build
        run: |
          rebuild/macserve/checks/release-build.sh "$RUNNER_TEMP/rebuild" > "$RUNNER_TEMP/rebuild.sums"
          cat "$RUNNER_TEMP/rebuild.sums"
          {
            echo "sha256=$(awk '$2 ~ /\/macserve-darwin-arm64$/ { print $1 }' "$RUNNER_TEMP/rebuild.sums")"
            echo "controller-sha256=$(awk '$2 ~ /\/macserve-controller-darwin-arm64$/ { print $1 }' "$RUNNER_TEMP/rebuild.sums")"
          } >> "$GITHUB_OUTPUT"

  reproducible:
    name: Reproducible release build (Linux build matches macOS rebuild)
    needs: reproducible-rebuild
    runs-on: ubuntu-latest
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build Darwin arm64 release
        run: checks/release-build.sh "$RUNNER_TEMP/dist"
      - name: Require a byte-identical rebuild
        working-directory: ${{ runner.temp }}/dist
        env:
          REBUILT_SHA256: ${{ needs.reproducible-rebuild.outputs.sha256 }}
          REBUILT_CONTROLLER_SHA256: ${{ needs.reproducible-rebuild.outputs.controller-sha256 }}
        run: |
          printf '%s  %s\n' \
            "$REBUILT_SHA256" macserve-darwin-arm64 \
            "$REBUILT_CONTROLLER_SHA256" macserve-controller-darwin-arm64 |
            sha256sum --check --strict

  # Dry run of release.yml's "Render Homebrew formula" step against the latest
  # published release's SHA256SUMS. Nothing is uploaded.
  homebrew-formula:
    name: Homebrew formula render (dry run)
    runs-on: ubuntu-latest
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Render against the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIST: ${{ runner.temp }}/dist
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          mkdir -p "$DIST"
          gh release download "$tag" --pattern SHA256SUMS --dir "$DIST"
          # Releases before the controller split publish no
          # macserve-controller-darwin-arm64; the renderer rightly refuses
          # their SHA256SUMS, so there is nothing to dry-run against yet.
          if ! awk '$2 == "macserve-controller-darwin-arm64" { found = 1 } END { exit !found }' "$DIST/SHA256SUMS"; then
            echo "::notice::$tag predates macserve-controller; skipping the formula dry run"
            exit 0
          fi
          go run ./checks/homebrew-formula \
            -tag "$tag" -repo "$GH_REPO" \
            -sums "$DIST/SHA256SUMS" > "$DIST/macserve.rb"
          cat "$DIST/macserve.rb"
          for asset in macserve-darwin-arm64 macserve-controller-darwin-arm64; do
            grep -F "sha256 \"$(awk -v a="$asset" '$2 == a { print $1 }' "$DIST/SHA256SUMS")\"" "$DIST/macserve.rb"
          done
