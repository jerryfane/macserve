<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-label="How macserve works: GitHub and your tools feed the controller queue; the worker runs jobs in up to 6 lanes; the keyholder signs the result, which goes back to GitHub as a check">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6676"/>
    </marker>
  </defs>
  <rect width="1080" height="640" rx="12" fill="#f6f7f9"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <rect fill="#ffffff" stroke="#d9dde5" stroke-width="1.5" x="20" y="40" width="200" height="96" rx="10"/>
    <text fill="#161a22" x="40" y="72" font-size="16" font-weight="600">GitHub</text>
    <text fill="#5d6676" x="40" y="96" font-size="13">A pull request gets</text>
    <text fill="#5d6676" x="40" y="114" font-size="13">a new commit</text>

    <rect fill="#ffffff" stroke="#d9dde5" stroke-width="1.5" x="20" y="200" width="200" height="96" rx="10"/>
    <text fill="#161a22" x="40" y="232" font-size="16" font-weight="600">Your tools</text>
    <text fill="#5d6676" x="40" y="256" font-size="13">Submit jobs or ask</text>
    <text fill="#5d6676" x="40" y="274" font-size="13">for status via the API</text>

    <rect fill="#ffffff" stroke="#d9dde5" stroke-width="1.5" x="20" y="500" width="200" height="96" rx="10"/>
    <text fill="#161a22" x="40" y="532" font-size="16" font-weight="600">GitHub check</text>
    <text fill="#5d6676" x="40" y="556" font-size="13">Green: safe to merge</text>
    <text fill="#5d6676" x="40" y="574" font-size="13">Red: something broke</text>
    <circle cx="190" cy="530" r="5" fill="#3fb950"/>
    <circle cx="206" cy="530" r="5" fill="#f85149"/>
    <rect fill="none" stroke="#d9dde5" stroke-width="1.5" stroke-dasharray="6 5" x="260" y="16" width="800" height="608" rx="14"/>
    <text fill="#5d6676" x="280" y="40" font-size="13" font-weight="600" letter-spacing="1">YOUR MAC</text>
    <rect fill="#ffffff" stroke="#d9dde5" stroke-width="1.5" x="290" y="60" width="300" height="300" rx="12"/>
    <text fill="#161a22" x="310" y="90" font-size="16" font-weight="600">Controller: the brain</text>
    <rect fill="#ffffff" stroke="#d9dde5" stroke-width="1.5" x="310" y="106" width="260" height="58" rx="8"/>
    <text fill="#161a22" x="324" y="130" font-size="14" font-weight="600">GitHub poller</text>
    <text fill="#5d6676" x="324" y="150" font-size="12.5">Every ~45 s: new commits to test?</text>
    <rect fill="#ffffff" stroke="#d9dde5" stroke-width="1.5" x="310" y="178" width="260" height="58" rx="8"/>
    <text fill="#161a22" x="324" y="202" font-size="14" font-weight="600">Queue</text>
    <text fill="#5d6676" x="324" y="222" font-size="12.5">Fair order across repositories</text>
    <rect fill="#ffffff" stroke="#d9dde5" stroke-width="1.5" x="310" y="250" width="260" height="58" rx="8"/>
    <text fill="#161a22" x="324" y="274" font-size="14" font-weight="600">Scheduler</text>
    <text fill="#5d6676" x="324" y="294" font-size="12.5">Starts a job when a lane is free</text>
    <text fill="#5d6676" x="310" y="340" font-size="12.5">Also posts results back to GitHub</text>
    <rect fill="#ffffff" stroke="#d9dde5" stroke-width="1.5" x="670" y="60" width="370" height="300" rx="12"/>
    <text fill="#161a22" x="690" y="90" font-size="16" font-weight="600">Worker: the hands</text>
    <text fill="#5d6676" x="690" y="110" font-size="12.5">Lanes (up to 6): one job per lane</text>
    <g font-size="13">
      <rect fill="#ffffff" stroke="#d9dde5" stroke-width="1.5" x="690" y="128" width="330" height="34" rx="7"/><text fill="#161a22" x="706" y="150">Lane 1 · xcodebuild + simulator</text>
      <rect fill="#ffffff" stroke="#d9dde5" stroke-width="1.5" x="690" y="170" width="330" height="34" rx="7"/><text fill="#161a22" x="706" y="192">Lane 2</text>
      <rect fill="#ffffff" stroke="#d9dde5" stroke-width="1.5" x="690" y="212" width="330" height="34" rx="7"/><text fill="#161a22" x="706" y="234">Lane 3</text>
      <rect fill="#ffffff" stroke="#d9dde5" stroke-width="1.5" x="690" y="254" width="330" height="34" rx="7"/><text fill="#161a22" x="706" y="276">Lane 4</text>
      <rect fill="#ffffff" stroke="#d9dde5" stroke-width="1.5" x="690" y="296" width="330" height="34" rx="7"/><text fill="#161a22" x="706" y="318">… up to Lane 6</text>
    </g>
    <rect fill="#ffffff" stroke="#d9dde5" stroke-width="1.5" x="670" y="410" width="370" height="96" rx="12"/>
    <text fill="#161a22" x="690" y="442" font-size="16" font-weight="600">Keyholder: the notary</text>
    <text fill="#5d6676" x="690" y="466" font-size="13">Signs every result, so a pass</text>
    <text fill="#5d6676" x="690" y="484" font-size="13">can't be faked</text>

    <rect fill="#ffffff" stroke="#d9dde5" stroke-width="1.5" x="290" y="410" width="300" height="96" rx="12"/>
    <text fill="#161a22" x="310" y="442" font-size="16" font-weight="600">Maintenance: the doctor</text>
    <text fill="#5d6676" x="310" y="466" font-size="13">Checks the host all the time;</text>
    <text fill="#5d6676" x="310" y="484" font-size="13">can hold new jobs if unhealthy</text>
    <path fill="none" stroke="#5d6676" stroke-width="1.6" marker-end="url(#head)" d="M220,88 C250,88 270,135 308,135"/>
    <path fill="none" stroke="#5d6676" stroke-width="1.6" marker-end="url(#head)" d="M220,248 C255,248 270,207 308,207"/>
    <path fill="none" stroke="#5d6676" stroke-width="1.6" marker-end="url(#head)" d="M440,164 L440,176"/>
    <path fill="none" stroke="#5d6676" stroke-width="1.6" marker-end="url(#head)" d="M440,236 L440,248"/>
    <path fill="none" stroke="#5d6676" stroke-width="1.6" marker-end="url(#head)" d="M570,275 L688,271"/>
    <text fill="#5d6676" x="630" y="262" font-size="12" text-anchor="middle">job</text>
    <path fill="none" stroke="#5d6676" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#head)" d="M670,190 L592,190"/>
    <text fill="#5d6676" x="630" y="178" font-size="11.5" text-anchor="middle">check-in</text>
    
    <path fill="none" stroke="#5d6676" stroke-width="1.6" marker-end="url(#head)" d="M855,330 L855,408"/>
    <text fill="#5d6676" x="865" y="378" font-size="12">finished: results</text>
    <path fill="none" stroke="#5d6676" stroke-width="1.6" marker-end="url(#head)" d="M670,470 C580,560 360,560 222,548"/>
    <text fill="#5d6676" x="420" y="580" font-size="12">signed result → check</text>
    <path fill="none" stroke="#5d6676" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#head)" d="M560,410 L560,310"/>
    <text fill="#5d6676" x="552" y="390" font-size="12" text-anchor="end">can pause</text>
  </g>
</svg>
